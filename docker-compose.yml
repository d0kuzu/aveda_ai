services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env}
    volumes:
      - service_databases:/var/lib/postgresql/data
      - ./deploy/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [storage]

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
      DATABASE_URL: postgres://auth_app@postgres:5432/auth_db?sslmode=disable
      PGPASSWORD: ${AUTH_DB_PASSWORD}
      ACCESS_SECRET: ${ACCESS_SECRET:?Set ACCESS_SECRET in .env}
      REFRESH_SECRET: ${REFRESH_SECRET:?Set REFRESH_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [services, storage]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
      DATABASE_URL: postgres://ai_app@postgres:5432/ai_db?sslmode=disable
      PGPASSWORD: ${AI_DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      BASE_URL: ${BASE_URL:-}
      TOKEN_PREFIX: ${TOKEN_PREFIX:-}
      TOKEN_LENGTH: ${TOKEN_LENGTH:-32}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [services, storage]

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8080
      AI_SERVICE_URL: http://ai-service:8080
      ACCESS_SECRET: ${ACCESS_SECRET}
    depends_on: [auth-service, ai-service]
    networks: [services]

networks:
  services:
  storage:

volumes:
  service_databases:
