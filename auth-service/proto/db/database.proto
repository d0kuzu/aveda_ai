syntax = "proto3";

package database;

option go_package = "diaxel_zerde/database-service/proto;proto";

service DatabaseService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc SaveRefreshToken(SaveRefreshTokenRequest) returns (SaveRefreshTokenResponse);
  rpc GetRefreshToken(GetRefreshTokenRequest) returns (RefreshTokenResponse);
  rpc DeleteRefreshToken(DeleteRefreshTokenRequest) returns (DeleteRefreshTokenResponse);
  rpc CreateAssistant(CreateAssistantRequest) returns (AssistantResponse);
  rpc GetAssistant(GetAssistantRequest) returns (AssistantResponse);
  rpc GetAssistantByAPIToken(GetAssistantByAPITokenRequest) returns (AssistantResponse);
  rpc UpdateAssistant(UpdateAssistantRequest) returns (AssistantResponse);
  rpc DeleteAssistant(DeleteAssistantRequest) returns (DeleteAssistantResponse);
  rpc GetAssistantsByUserID(GetAssistantsByUserIDRequest) returns (AssistantsResponse);
  rpc CreateChat(CreateChatRequest) returns (ChatResponse);
  rpc GetChat(GetChatRequest) returns (ChatResponse);
  rpc GetChatsByUser(GetChatsByUserRequest) returns (ChatsResponse);
  rpc UpdateChat(UpdateChatRequest) returns (ChatResponse);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  rpc SaveMessage(SaveMessageRequest) returns (MessageResponse);
  rpc GetChatMessages(GetChatMessagesRequest) returns (MessagesResponse);
  rpc GetAllChatMessages(GetAllChatMessagesRequest) returns (MessagesResponse);
  rpc UpdateMessage(UpdateMessageRequest) returns (MessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc GetChatPagesCount(GetChatPagesCountRequest) returns (ChatPagesCountResponse);
  rpc GetChatPage(GetChatPageRequest) returns (ChatsResponse);
  rpc GetChatPagesCountByUserID(GetChatPagesCountByUserIDRequest) returns (ChatPagesCountResponse);
  rpc GetChatPageByUserID(GetChatPageByUserIDRequest) returns (ChatsResponse);
  rpc SearchChatsByCustomer(SearchChatsByCustomerRequest) returns (SearchChatsByCustomerResponse);
  rpc GetLatestChatByCustomer(GetLatestChatByCustomerRequest) returns (ChatResponse);
  rpc SaveTwilioConfig(SaveTwilioConfigRequest) returns (TwilioConfigResponse);
  rpc GetTwilioConfig(GetTwilioConfigRequest) returns (TwilioConfigResponse);
  rpc DeleteTwilioConfig(DeleteTwilioConfigRequest) returns (DeleteTwilioConfigResponse);
  rpc DeleteChatAndMessages(DeleteChatAndMessagesRequest) returns (DeleteChatAndMessagesResponse);
  rpc UpdateChatIsEnd(UpdateChatIsEndRequest) returns (ChatResponse);
  rpc GetPeriodMetrics(GetPeriodMetricsRequest) returns (GetPeriodMetricsResponse);
  rpc GetPeriodChats(GetPeriodChatsRequest) returns (GetPeriodChatsResponse);
  rpc GetWeeklyChatsStarted(GetWeeklyChatsStartedRequest) returns (GetWeeklyChatsStartedResponse);
  rpc IsCustomerBlocked(IsCustomerBlockedRequest) returns (IsCustomerBlockedResponse);
  rpc BlockCustomer(BlockCustomerRequest) returns (BlockCustomerResponse);
  rpc GetAllBlockedCustomers(GetAllBlockedCustomersRequest) returns (GetAllBlockedCustomersResponse);
}

message CreateUserRequest {
  string email = 1;
  string password_hash = 2;
  string role = 3;
}

message GetUserRequest {
  string id = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string password_hash = 3;
  string role = 4;
  string created_at = 5;
}

message SaveRefreshTokenRequest {
  string user_id = 1;
  string token_hash = 2;
  string expires_at = 3;
}

message SaveRefreshTokenResponse {
  bool success = 1;
}

message GetRefreshTokenRequest {
  string token_hash = 1;
}

message RefreshTokenResponse {
  string id = 1;
  string user_id = 2;
  string token_hash = 3;
  string expires_at = 4;
  string created_at = 5;
}

message DeleteRefreshTokenRequest {
  string token_hash = 1;
}

message DeleteRefreshTokenResponse {
  bool success = 1;
}

message CreateChatRequest {
  reserved 5;
  string assistant_id = 1;
  string customer_id = 2;
  string platform = 3;
  string started_at = 4;
}

message ChatResponse {
  reserved 11, 12, 13, 15, 16, 17, 18, 19;
  string id = 1;
  string assistant_id = 2;
  string customer_id = 3;
  string platform = 4;
  string created_at = 5;
  string updated_at = 8;
  int32 message_count = 9;
  bool is_end = 10;
  string started_at = 14;
}

message SaveMessageRequest {
  string chat_id = 1;
  string role = 2;
  string content = 3;
  string platform = 4;
  string time = 5;
}

message MessageResponse {
  string id = 1;
  string chat_id = 2;
  string role = 3;
  string content = 4;
  string platform = 5;
  string created_at = 6;
}

message GetChatMessagesRequest {
  string chat_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetAllChatMessagesRequest {
  string chat_id = 1;
}

message MessagesResponse {
  repeated MessageResponse messages = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message UpdateUserRequest {
  string id = 1;
  string email = 2;
  string password_hash = 3;
  string role = 4;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message GetChatRequest {
  string id = 1;
}

message GetChatsByUserRequest {
  repeated string assistant_ids = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ChatsResponse {
  repeated ChatResponse chats = 1;
}

message UpdateChatRequest {
  string id = 1;
  string assistant_id = 2;
  string customer_id = 3;
  string platform = 4;
}

message DeleteChatRequest {
  string id = 1;
}

message DeleteChatResponse {
  bool success = 1;
}

message UpdateMessageRequest {
  string id = 1;
  string chat_id = 2;
  string role = 3;
  string content = 4;
  string platform = 5;
}

message DeleteMessageRequest {
  string id = 1;
}

message DeleteMessageResponse {
  bool success = 1;
}

message GetChatPagesCountRequest {
  string assistant_id = 1;
  int32 chats_per_page = 2;
}

message ChatPagesCountResponse {
  int32 pages_count = 1;
}

message GetChatPageRequest {
  string assistant_id = 1;
  int32 page = 2;
  int32 chats_per_page = 3;
}

message GetChatPagesCountByUserIDRequest {
  reserved 3;
  repeated string assistant_ids = 1;
  int32 chats_per_page = 2;
}

message GetChatPageByUserIDRequest {
  reserved 4;
  repeated string assistant_ids = 1;
  int32 page = 2;
  int32 chats_per_page = 3;
}

message SearchChatsByCustomerRequest {
  reserved 3;
  repeated string assistant_ids = 1;
  string search = 2;
}

message SearchChatsByCustomerResponse {
  repeated ChatResponse chats = 1;
  int32 total_count = 2;
}

message CreateAssistantRequest {
  string name = 1;
  string api_token = 2;
  string user_id = 3;
  string telegram_bot_token = 4;
  string type = 5;
}

message AssistantResponse {
  string id = 1;
  string name = 2;
  string api_token = 3;
  string user_id = 4;
  string created_at = 5;
  string updated_at = 6;
  string configuration = 7;
  string telegram_bot_token = 8;
  string type = 9;
}

message GetAssistantRequest {
  string id = 1;
}

message GetAssistantByAPITokenRequest {
  string api_token = 1;
}

message UpdateAssistantRequest {
  string id = 1;
  string name = 2;
  string api_token = 3;
  string user_id = 4;
  string telegram_bot_token = 5;
  string type = 6;
  string configuration = 7;
}

message DeleteAssistantRequest {
  string id = 1;
}

message DeleteAssistantResponse {
  bool success = 1;
}

message GetAssistantsByUserIDRequest {
  string user_id = 1;
}

message AssistantsResponse {
  repeated AssistantResponse assistants = 1;
}

message GetLatestChatByCustomerRequest {
  string assistant_id = 1;
  string customer_id = 2;
}

message SaveTwilioConfigRequest {
  string assistant_id = 1;
  string user_id = 2;
  string twilio_number = 3;
  string account_sid = 4;
  string auth_token = 5;
}

message GetTwilioConfigRequest {
  string assistant_id = 1;
}

message TwilioConfigResponse {
  string assistant_id = 1;
  string user_id = 2;
  string twilio_number = 3;
  string account_sid = 4;
  string auth_token = 5;
  string created_at = 6;
  string updated_at = 7;
}

message DeleteTwilioConfigRequest {
  string assistant_id = 1;
}

message DeleteTwilioConfigResponse {
  bool success = 1;
}

message DeleteChatAndMessagesRequest {
  string chat_id = 1;
}

message DeleteChatAndMessagesResponse {
  bool success = 1;
}

message UpdateChatIsEndRequest {
  string id = 1;
  bool is_end = 2;
}

message GetPeriodMetricsRequest {
  string assistant_id = 1;
  string start_time = 2;
  string end_time = 3;
}

message GetPeriodMetricsResponse {
  reserved 3;
  int32 started_chats = 1;
  int32 completed_chats = 2;
}

message GetPeriodChatsRequest {
  string assistant_id = 1;
  string start_time = 2;
  string end_time = 3;
  string category = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message GetPeriodChatsResponse {
  repeated ChatResponse chats = 1;
  int64 total_count = 2;
}

message DailyCount {
  string date = 1;
  int32 count = 2;
}

message GetWeeklyChatsStartedRequest {
  string assistant_id = 1;
  string start_time = 2;
  string timezone = 3;
}

message GetWeeklyChatsStartedResponse {
  repeated DailyCount days = 1;
}

message IsCustomerBlockedRequest {
  string user_id = 1;
}

message IsCustomerBlockedResponse {
  bool is_blocked = 1;
}

message BlockCustomerRequest {
  string user_id = 1;
}

message BlockCustomerResponse {
  bool success = 1;
}

message GetAllBlockedCustomersRequest {}

message GetAllBlockedCustomersResponse {
  repeated string user_ids = 1;
}
