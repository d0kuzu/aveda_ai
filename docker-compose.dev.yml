services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    ports: !override
      - "127.0.0.1:5432:5432"
    volumes: !override
      - dev_service_databases:/var/lib/postgresql/data
      - ./deploy/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro

  auth-service:
    extends:
      file: docker-compose.yml
      service: auth-service
  ai-service:
    extends:
      file: docker-compose.yml
      service: ai-service
  api-gateway:
    extends:
      file: docker-compose.yml
      service: api-gateway
    ports: !override
      - "8080:8080"

networks:
  services:
  storage:

volumes:
  dev_service_databases:
